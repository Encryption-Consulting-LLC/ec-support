# EC Support Portal -- port-80 edge for this VM.
#
# The portal itself is served over HTTPS (nginx-support-portal-ssl.conf,
# self-signed cert with the LAN IP in its SANs). This block's only jobs
# are to 301 plain-HTTP visitors to HTTPS and to keep /api/v1/healthz
# answerable over HTTP for the health probe.
#
#   /api/v1/auth/*     -> existing EC auth backend (real Keycloak, real
#   /api/v1/user/*        client credentials -- unchanged)
#   /api/v1/support/*  -> this repo's Flask app on 127.0.0.1:8006
#   everything else    -> the SPA, with history-API fallback

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ec-support-portal/dist;
    index index.html;

    # HTTPS is live on this host (self-signed, IP SAN) — plain-HTTP
    # visitors get bounced there so the portal is effectively
    # HTTPS-only. healthz stays answerable over HTTP below so the
    # health probe and any monitoring keep working unchanged.
    location / {
        return 301 https://$host$request_uri;
    }

    location = /api/v1/healthz {
        proxy_pass http://127.0.0.1:8006;
        access_log off;
    }

    # Case attachments cap at 20 MB; headroom for multipart overhead.
    client_max_body_size 25m;

    access_log /var/log/nginx/ec-support.access.log;
    error_log  /var/log/nginx/ec-support.error.log;

    # Auth and user endpoints are proxied to the existing EC backend, so the
    # browser sees one origin and the vendored login code needs no changes.
    location /api/v1/auth/ {
        proxy_pass https://resourcehubapi.encryptionconsulting.com/api/v1/auth/;
        proxy_set_header Host resourcehubapi.encryptionconsulting.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    location /api/v1/user/ {
        proxy_pass https://resourcehubapi.encryptionconsulting.com/api/v1/user/;
        proxy_set_header Host resourcehubapi.encryptionconsulting.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    location /api/v1/support/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or
    # clients keep booting a stale bundle after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

}
