# EC Support Portal — single-origin topology.
#
# One domain serves the SPA and fronts BOTH API path families, so the
# browser never does CORS and the vendored login code works unchanged:
#
#   /api/v1/auth/*     -> existing EC auth backend (same Keycloak realms
#   /api/v1/user/*        and credentials the Client Portal uses; /user/*
#                         only carries the best-effort theme preference)
#   /api/v1/support/*  -> this repo's Flask app (gunicorn on 127.0.0.1:8006)
#   everything else    -> SPA dist/ with history-API fallback
#
# REQUIRED on the auth backend side: add https://support.encryptionconsulting.com
# to its allowed post-login redirect origins, so the Keycloak
# required-action flow can land back on THIS portal with #session_id.

server {
    listen 443 ssl http2;
    server_name support.encryptionconsulting.com;

    # ssl_certificate     /etc/ssl/ec/support.fullchain.pem;
    # ssl_certificate_key /etc/ssl/ec/support.key.pem;

    root /var/www/ec-support-portal/dist;
    index index.html;

    # attachment cap is 20 MB; headroom for multipart overhead
    client_max_body_size 25m;

    location /api/v1/auth/ {
        proxy_pass https://resourcehubapi.encryptionconsulting.com/api/v1/auth/;
        proxy_set_header Host resourcehubapi.encryptionconsulting.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /api/v1/user/ {
        proxy_pass https://resourcehubapi.encryptionconsulting.com/api/v1/user/;
        proxy_set_header Host resourcehubapi.encryptionconsulting.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    location /api/v1/support/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # attachment uploads shouldn't be buffered to disk twice
        proxy_request_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 80;
    server_name support.encryptionconsulting.com;
    return 301 https://$host$request_uri;
}
