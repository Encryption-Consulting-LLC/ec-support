# EC Support Portal — HTTPS edge for encryption-support.encryptionconsulting.com.
#
# Coexists with nginx-support-portal-dev.conf (the default_server that
# answers plain-HTTP requests to the LAN IP): nginx routes by Host, so
# LAN-IP access keeps working during the transition and this block only
# answers for the real domain.
#
# Certificate files expected at:
#   /etc/ssl/ec/support-portal.crt      (cert + chain, PEM)
#   /etc/ssl/ec/support-portal.key      (private key, PEM, 0600 root)
# Install them with deploy/enable-https.sh — see that script for the
# two ways to obtain them (Cloudflare Origin CA or Let's Encrypt).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name encryption-support.encryptionconsulting.com;

    ssl_certificate     /etc/ssl/ec/support-portal.crt;
    ssl_certificate_key /etc/ssl/ec/support-portal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:ec_ssl:10m;
    ssl_session_timeout 1d;

    # Start with a 1-day HSTS while the cutover settles; raise to
    # 31536000 (+ preload if desired) once HTTPS has been stable.
    add_header Strict-Transport-Security "max-age=86400" always;

    root /var/www/ec-support-portal/dist;
    index index.html;

    client_max_body_size 25m;

    access_log /var/log/nginx/ec-support-ssl.access.log;
    error_log  /var/log/nginx/ec-support-ssl.error.log;

    location /api/v1/auth/ {
        proxy_pass https://resourcehubapi.encryptionconsulting.com/api/v1/auth/;
        proxy_set_header Host resourcehubapi.encryptionconsulting.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    location /api/v1/user/ {
        proxy_pass https://resourcehubapi.encryptionconsulting.com/api/v1/user/;
        proxy_set_header Host resourcehubapi.encryptionconsulting.com;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }

    location /api/v1/support/ {
        proxy_pass http://127.0.0.1:8006;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location = /api/v1/healthz {
        proxy_pass http://127.0.0.1:8006;
        access_log off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}

# Plain-HTTP requests that arrive WITH the domain name get bounced to
# HTTPS. (Requests to the bare LAN IP still hit the dev default_server.)
server {
    listen 80;
    listen [::]:80;
    server_name encryption-support.encryptionconsulting.com;
    return 301 https://$host$request_uri;
}
